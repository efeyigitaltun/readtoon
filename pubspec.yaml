name: readtoon
description: "Modern manga ve webtoon okuyucu - CDisplayEx alternatifi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # AniList GraphQL API
  http: ^1.6.0

  # Lokal Veritabanı
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Arşiv okuma – ZIP/CBZ (stabil, proven)
  archive: ^3.6.1

  # Arşiv okuma – RAR/CBR + auto-detect facade (pure Dart)
  koni_archive: ^0.9.0

  # PDF sayfa sayfa render (Android native PdfRenderer)
  pdfx: ^2.11.0

  # SAF klasör seçimi, tarama ve geçici yerel dosya köprüsü
  saf: ^2.1.2
  file_picker: ^8.1.7

  # Yardımcı
  path_provider: ^2.1.5
  path: ^1.9.1

  # Ekranı açık tut (Wakelock)
  wakelock_plus: ^1.2.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.jpg"
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icon/app_icon.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
